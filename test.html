<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<h2>ShopMail TEST 2</h2>
<input id="email" placeholder="Your Email">
<button onclick="sendCode()">Send Code</button>
<p id="debugText" style="color:blue"></p>
<p id="authError" style="color:red"></p>
<script>
async function sendCode(){
document.getElementById('debugText').innerText = "Button tapped!";
let email = document.getElementById('email').value.trim();
if(!email.includes('@')){document.getElementById('debugText').innerText="Button tapped but no @";return;}
if(!window.supabase){document.getElementById('debugText').innerText="Button tapped BUT Supabase script did NOT load - check internet";return;}
try{
let client = window.supabase.createClient("https://kgsmotaqcxwkwqfijyof.supabase.co","sb_publishable_azXjTjW8oJFpNRri1ZmoFw_bglvYlkF");
document.getElementById('debugText').innerText="Button tapped! Sending to "+email;
let r = await client.auth.signInWithOtp({email:email,options:{shouldCreateUser:true}});
if(r.error){document.getElementById('debugText').innerText="Supabase error: "+r.error.message;alert(r.error.message);}
else{document.getElementById('debugText').innerText="Code sent! Check inbox + Spam";alert("Code sent to "+email);}
}catch(e){document.getElementById('debugText').innerText="Error: "+e.message;alert("Error: "+e.message);}
}
</script>
</body>
</html>
